<!-- PDF Preview -->
<mat-dialog-content class="p-0">
    <div class="w-full h-[90vh] flex flex-col bg-white rounded-xl overflow-hidden shadow-xl">
      <div class="flex items-center justify-between px-6 py-4 border-b bg-purple-600 text-white">
        <h2 class="text-xl font-semibold">📄 {{ data.name }}</h2>
        <button mat-icon-button (click)="dialogRef.close()">
          <mat-icon>close</mat-icon>
        </button>
      </div>
      <iframe
        [src]="data.url | safeUrl"
        class="flex-1 border-none"
        width="100%"
        height="100%"
      ></iframe>
    </div>
  </mat-dialog-content>
