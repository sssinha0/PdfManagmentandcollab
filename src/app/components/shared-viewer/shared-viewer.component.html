<div class="min-h-screen bg-gradient-to-br from-purple-100 to-blue-50 p-6">
  <mat-card class="max-w-6xl mx-auto p-8 rounded-3xl shadow-2xl bg-white border border-purple-200">
    
    <!-- PDF Title -->
    <h2 class="text-3xl font-extrabold text-purple-700 mb-6">📄 {{ file?.name }}</h2>

    <div class="grid md:grid-cols-3 gap-8">
      
      <!-- PDF Preview -->
      <div class="md:col-span-2">
        <iframe
          [src]="file?.url | safeUrl"
          class="w-full h-[600px] border-2 border-purple-300 rounded-xl shadow-md"
        ></iframe>
      </div>

      <!-- Comments Sidebar -->
      <div>
        <h3 class="text-xl font-semibold text-purple-700 mb-3">💬 Comments</h3>

        <!-- Comment List -->
        <div class="bg-white border border-gray-300 p-4 rounded-lg shadow-sm max-h-[500px] overflow-y-auto space-y-4">
          <div *ngFor="let c of comments" class="p-2 bg-purple-50 rounded-lg shadow">
            <div class="text-sm font-bold text-purple-800">{{ c.author }}</div>
            <div class="text-sm text-gray-800">{{ c.text }}</div>
            <div class="text-xs text-gray-400 italic">
              {{ c.createdAt?.toDate() | date: 'short' }}
            </div>
          </div>
        </div>

        <!-- Add Comment Form -->
        <form (ngSubmit)="addComment()" class="mt-6 space-y-4">
          <mat-form-field appearance="fill" class="w-full">
            <mat-label>Your Name</mat-label>
            <input matInput type="text" [(ngModel)]="name" name="name" required />
          </mat-form-field>
          <mat-form-field appearance="fill" class="w-full">
            <mat-label>Your Comment</mat-label>
            <textarea
              matInput
              [(ngModel)]="newComment"
              name="comment"
              rows="3"
              required
            ></textarea>
          </mat-form-field>

          <button
            mat-flat-button
            color="primary"
            type="submit"
            class="w-full py-2 rounded-lg font-semibold shadow-md"
          >
            ➕ Post Comment
          </button>
        </form>
      </div>
    </div>
  </mat-card>
</div>
