<div class="p-4 bg-gray-100 min-h-screen">
    <mat-card class="max-w-4xl mx-auto p-6 shadow-lg">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold">Your PDFs</h2>
        <button mat-stroked-button color="warn" (click)="logout()">Logout</button>
      </div>
  
      <div class="flex flex-col md:flex-row gap-4 mb-4">
        <input type="file" (change)="onFileSelected($event)" accept=".pdf" />
        <mat-form-field class="flex-1" appearance="fill">
          <mat-label>Search</mat-label>
          <input matInput [(ngModel)]="searchTerm" placeholder="Search PDFs..." />
        </mat-form-field>
      </div>
  
      <div *ngIf="filteredFiles.length === 0" class="text-gray-500 mt-4">
        No files uploaded yet.
      </div>
  
      <mat-list *ngIf="filteredFiles.length > 0">
        <mat-list-item *ngFor="let file of filteredFiles" class="flex justify-between">
          <div>
            <p class="font-medium">{{ file.name }}</p>
            <p class="text-xs text-gray-500">{{ file.createdAt.toDate() | date:'short' }}</p>
          </div>
          <div>
            <button mat-button (click)="previewPDF(file)">Preview</button>
            <button mat-button color="primary" (click)="sharePDF(file.id)">Share</button>
          </div>
        </mat-list-item>
      </mat-list>
  
      <div *ngIf="selectedPDF" class="mt-6">
        <h3 class="text-lg font-semibold">Preview: {{ selectedPDF.name }}</h3>
        <iframe [src]="selectedPDF.url " width="100%" height="500px" class="mt-2 border rounded"></iframe>
      </div>
    </mat-card>
  </div>
