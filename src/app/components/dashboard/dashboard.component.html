<div class="p-6 bg-gradient-to-tr from-blue-50 to-purple-100 min-h-screen">
  <mat-card class="max-w-6xl mx-auto p-8 rounded-3xl shadow-2xl bg-white">

    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
      <h2 class="text-4xl font-extrabold text-purple-700">📚 Your PDFs</h2>
      <button mat-stroked-button color="warn" (click)="logout()" class="px-6 py-2 rounded-xl text-base">
        🔒 Logout
      </button>
    </div>

    <!-- Upload & Search -->
    <div class="flex flex-col md:flex-row gap-6 items-center mb-8">
      <input
        type="file"
        class="px-4 py-2 border-2 border-dashed border-purple-400 bg-purple-50 text-purple-800 font-medium rounded-lg w-full md:w-auto shadow"
        (change)="onFileSelected($event)"
        accept=".pdf"
      />

      <mat-form-field appearance="fill" class="flex-1 bg-white rounded-lg shadow-md">
        <mat-label>🔎 Search PDFs...</mat-label>
        <input matInput [(ngModel)]="searchTerm" (ngModelChange)="filterFiles()" />
      </mat-form-field>
    </div>

    <!-- No Files Message -->
    <div *ngIf="filteredFiles.length === 0" class="text-purple-600 text-center mt-10 text-lg italic">
      😕 No files uploaded yet.
    </div>

    <!-- PDF File List as Cards -->
    <div *ngIf="filteredFiles.length > 0" class="grid md:grid-cols-2 gap-6">
      <mat-card *ngFor="let file of filteredFiles" class="rounded-2xl p-6 bg-gradient-to-r from-indigo-100 to-pink-100 shadow-xl">
        <div class="mb-4">
          <h3 class="text-xl font-semibold text-gray-800">{{ file.name }}</h3>
          <p class="text-sm text-gray-600">{{ file?.createdAt?.toDate() | date:'short' }}</p>
        </div>

        <div class="flex flex-wrap gap-3">
          <button mat-stroked-button color="primary" (click)="previewPDF(file)">👁️ Preview</button>
          <button mat-flat-button color="accent" (click)="sharePDF(file.id)">🔗 Share</button>
          <button mat-stroked-button color="secondary" (click)="detailsView(file)">📄 Details</button>
          <button mat-flat-button color="warn" (click)="openShareDialog(file)">📧 Share via Email</button>
        </div>
      </mat-card>
    </div>

    

  </mat-card>
</div>
