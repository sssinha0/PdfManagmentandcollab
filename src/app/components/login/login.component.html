<div class="min-h-screen flex items-center justify-center bg-gray-100">
    <mat-card class="w-full max-w-md p-6 shadow-lg">
      <h2 class="text-2xl font-semibold mb-6 text-center">Login to Your Account</h2>
  
      <form (ngSubmit)="login()" class="flex flex-col gap-4">
        <mat-form-field appearance="fill" class="w-full">
          <mat-label>Email</mat-label>
          <input matInput type="email" [(ngModel)]="email" name="email" required />
        </mat-form-field>
  
        <mat-form-field appearance="fill" class="w-full">
          <mat-label>Password</mat-label>
          <input matInput type="password" [(ngModel)]="password" name="password" required />
        </mat-form-field>
  
        <button mat-flat-button color="primary" type="submit" class="w-full">
          Login
        </button>
      </form>
  
      <p class="text-sm text-center mt-4">
        Don’t have an account?
        <a routerLink="/signup" class="text-blue-600 hover:underline">Sign up</a>
      </p>
    </mat-card>
  </div>
