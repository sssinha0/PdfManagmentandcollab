<div class="min-h-screen bg-gradient-to-br from-indigo-100 via-purple-100 to-pink-100 flex items-center justify-center p-6">
  <mat-card class="w-full max-w-md p-8 rounded-3xl shadow-2xl bg-white border border-purple-200">
    
    <h2 class="text-3xl font-extrabold text-center text-purple-700 mb-8">📝 Create a New Account</h2>

    <form (ngSubmit)="signup()" class="flex flex-col gap-6">
      
      <mat-form-field appearance="fill" class="w-full">
        <mat-label>Email Address</mat-label>
        <input matInput type="email" [(ngModel)]="email" name="email" required />
      </mat-form-field>

      <mat-form-field appearance="fill" class="w-full">
        <mat-label>Password</mat-label>
        <input matInput type="password" [(ngModel)]="password" name="password" required />
      </mat-form-field>

      <button
        mat-flat-button
        color="primary"
        type="submit"
        class="w-full py-2 rounded-lg font-semibold text-lg shadow-md"
      >
        🚀 Sign Up
      </button>
    </form>

    <p class="text-sm text-center mt-6 text-gray-700">
      Already have an account?
      <a routerLink="/login" class="text-purple-600 font-semibold hover:underline">Log in</a>
    </p>
    
  </mat-card>
</div>
